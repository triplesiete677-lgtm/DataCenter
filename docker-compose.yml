version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    ports:
      - "80:80"

  database:
    build: ./database # o usa una imagen oficial de postgres/mysql directamente
    ports:
      - "5432:5432"